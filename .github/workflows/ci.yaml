name: Site CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-ci:
    name: Site CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Quartz plugins
        run: npm run install-plugins
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build site
        run: node quartz/bootstrap-cli.mjs build --concurrency=1
      - name: Verify Chinese pages when available
        if: ${{ hashFiles('tools/verify-zh.mjs') != '' }}
        run: node tools/verify-zh.mjs
